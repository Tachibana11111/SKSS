const view=document.getElementById('view'),world=document.getElementById('world'),zl=document.getElementById('z');
let s=1,tx=0,ty=0;const MIN=0.08,MAX=10;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;zl.textContent=Math.round(s*100)+'%'}
function zoomAt(f,cx,cy){const n=Math.min(MAX,Math.max(MIN,s*f));f=n/s;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;s=n;apply()}
function vc(){const r=view.getBoundingClientRect();return[r.width/2,r.height/2]}
// dựng
world.style.width=DATA.world.W+'px';world.style.height=DATA.world.H+'px';
for(const c of DATA.cols){
  const d=document.createElement('div');d.className='col';d.style.left=(c.x-20)+'px';d.style.top=c.ty+'px';world.appendChild(d);
  const t=document.createElement('div');t.className='ct';t.style.left=c.x+'px';t.style.top=c.ty+'px';t.innerHTML='<h2></h2><p></p>';
  t.querySelector('h2').textContent=c.title;t.querySelector('p').textContent=c.note;world.appendChild(t);
}
for(const it of DATA.items){
  const f=document.createElement('div');f.className='fig';f.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px`;
  const im=new Image();im.decoding='async';im.src=it.src;im.alt=it.id;f.appendChild(im);
  const g=document.createElement('div');g.className='tag'+(it.rev?' rev':'');
  g.innerHTML='<b></b> ';g.firstChild.textContent='#'+it.no+' '+it.id.replace('.svg','');
  g.appendChild(document.createTextNode(' '+it.label+(it.rev?'  ◄ vẽ theo chiều Omagari→Morioka':'')));
  f.appendChild(g);world.appendChild(f);
}
// liên kết (※, A, B…) vẽ phủ lên
const NSV='http://www.w3.org/2000/svg';const ov=document.createElementNS(NSV,'svg');ov.setAttribute('width',DATA.world.W);ov.setAttribute('height',DATA.world.H);ov.style.cssText='position:absolute;left:0;top:0;pointer-events:none;overflow:visible';world.appendChild(ov);
const byId={};const figEls=world.querySelectorAll('.fig');DATA.items.forEach((it,i)=>{byId[it.id]=it;it.el=figEls[i]});
function drawLinks(){ov.innerHTML='';for(const l of DATA.links){const A=byId[l.a],B=byId[l.b];const x1=A.x+l.ax,y1=A.y+l.ay,x2=B.x+l.bx,y2=B.y+l.by;
 const p=document.createElementNS(NSV,'path');const mx=(x1+x2)/2;p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);p.setAttribute('fill','none');p.setAttribute('stroke','#ff3b5c');p.setAttribute('stroke-width','3');p.setAttribute('stroke-dasharray','10 6');ov.appendChild(p);
 for(const q of [[x1,y1],[x2,y2]]){const c=document.createElementNS(NSV,'circle');c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);c.setAttribute('r',7);c.setAttribute('fill','#ff3b5c');ov.appendChild(c)}
 const t=document.createElementNS(NSV,'text');t.setAttribute('x',mx);t.setAttribute('y',(y1+y2)/2-8);t.setAttribute('fill','#ff8fa3');t.setAttribute('font-size','20');t.setAttribute('text-anchor','middle');t.textContent=l.label;ov.appendChild(t)}}
drawLinks();
let edit=false,dragIt=null,dg=null;
document.getElementById('ed').onclick=function(){edit=!edit;this.style.background=edit?'#2f6fb5':'';this.textContent=edit?'Chỉnh tay: BẬT (kéo từng hình)':'Chỉnh tay'};
document.getElementById('ex').onclick=()=>{const o={};DATA.items.forEach(i=>o[i.id]=[Math.round(i.x*10)/10,Math.round(i.y*10)/10]);prompt('Sao chép vị trí (Ctrl+C):',JSON.stringify(o))};
world.addEventListener('pointerdown',e=>{if(!edit)return;const f=e.target.closest&&e.target.closest('.fig');if(!f)return;const it=DATA.items.find(i=>i.el===f);if(!it)return;dragIt=it;dg=[e.clientX,e.clientY,it.x,it.y];e.stopPropagation();f.setPointerCapture(e.pointerId)},true);
world.addEventListener('pointermove',e=>{if(!dragIt)return;dragIt.x=dg[2]+(e.clientX-dg[0])/s;dragIt.y=dg[3]+(e.clientY-dg[1])/s;dragIt.el.style.left=dragIt.x+'px';dragIt.el.style.top=dragIt.y+'px';drawLinks();e.stopPropagation()},true);
world.addEventListener('pointerup',e=>{if(dragIt){dragIt=null;e.stopPropagation()}},true);
// kéo & zoom
const ptr=new Map();let lastD=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);view.classList.add('drag');lastD=0});
view.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
  if(ptr.size===1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);apply()}
  else if(ptr.size===2){ptr.set(e.pointerId,[e.clientX,e.clientY]);const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastD){const r=view.getBoundingClientRect();zoomAt(d/lastD,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top)}lastD=d}
});
const up=e=>{ptr.delete(e.pointerId);if(!ptr.size)view.classList.remove('drag');lastD=0};
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
view.addEventListener('dblclick',e=>{const r=view.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top)});
document.getElementById('zi').onclick=()=>{const[c,d]=vc();zoomAt(1.4,c,d)};
document.getElementById('zo').onclick=()=>{const[c,d]=vc();zoomAt(1/1.4,c,d)};
function fit(){const r=view.getBoundingClientRect();s=Math.min(r.width/DATA.world.W,r.height/DATA.world.H);tx=(r.width-DATA.world.W*s)/2;ty=(r.height-DATA.world.H*s)/2;apply()}
document.getElementById('fit').onclick=fit;
function centerOn(x,y,z){const r=view.getBoundingClientRect();if(z)s=z;tx=r.width/2-x*s;ty=r.height/2-y*s;apply()}
for(const b of document.querySelectorAll('[data-go]')){b.onclick=()=>{const c=DATA.cols.find(c=>c.key===b.dataset.go);const r=view.getBoundingClientRect();
  s=Math.min(1,(r.height-20)/ (Math.min(c.y1-c.y0,1200)+160));tx=r.width/2-(c.x+c.w/2)*s;ty=10-20*s;apply()}}

const q=document.getElementById('q'),res=document.getElementById('res');
const CT={tohoku:'Tohoku',yamagata:'Yamagata',akita:'Akita'};
q.addEventListener('input',()=>{const v=q.value.trim();res.innerHTML='';if(!v){res.style.display='none';return}
  const hit=DATA.names.filter(n=>n.n.includes(v)).slice(0,40);
  for(const h of hit){const d=document.createElement('div');d.textContent=h.n+' ';const sm=document.createElement('small');sm.textContent=CT[h.col]+' · '+h.fig.replace('.svg','');d.appendChild(sm);
    d.onclick=()=>{centerOn(h.x,h.y,2.2);const m=document.createElement('div');m.className='mark';m.style.cssText=`left:${h.x-40}px;top:${h.y-30}px;width:80px;height:50px`;world.appendChild(m);setTimeout(()=>m.remove(),3500);res.style.display='none'};res.appendChild(d)}
  if(!hit.length){res.textContent='Không thấy';res.style.padding='8px 10px'}else res.style.padding='0';res.style.display='block'});
document.addEventListener('keydown',e=>{if(e.target===q)return;if(e.key==='+'||e.key==='=')document.getElementById('zi').click();if(e.key==='-')document.getElementById('zo').click();if(e.key==='0')fit()});
