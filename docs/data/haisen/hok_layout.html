:root{--bg:#1d2126;--panel:#262b31;--fg:#e8eaed;--mut:#9aa3ad;--acc:#4fa3ff}

à 40,8) suốt cả tuyến nên bộ trích gán vai trò đường đúng ở cả 18 ga (khác Kyushu, nơi Hakata và Kagoshima-Chuo phải đánh giá bằng mắt).</li>\n<li><b>[!]</b> Hình Nagano không vẽ đường viền mảnh ở mép sân ga nên bộ trích lúc đầu bỏ sót ga này; đã thêm điều kiện dự phòng riêng cho Hokuriku (sân ga nằm sát đường màu Shinkansen thì tính là sân ga Shinkansen). Điều kiện này bật riêng vì bật cho Kyushu làm lọt ga giả Hakata-Minami.</li>\n<li><b>[I]</b> Tên tiếng Anh của Joetsu-Myoko (hình ghi <i>Jōetsumyōkō</i>) lấy theo game. Takasaki (hình 030_01) không nằm trong phạm vi này vì dùng chung với Joetsu.</li>\n<li><b>[I]</b> Đã bỏ khỏi đồ thị/mockup: đường thường, tín hiệu, depot (Nagano Shinkansen Untenjo và Vehicle Center, Hakusan, Tsuruga). Giữ ghi chéo giữa hai đường chính.</li>\n<li><b>[I]</b> Khoảng cách ghi chéo → mét theo tỉ lệ 54 đơn vị = 440 m (sân ga trong game); hình không theo tỉ lệ. Ga có đường nhánh (loại dPduPu) giữ ghi chéo ở vị trí cũ của chữ X (1300 m trước / 720 m sau) theo quy ước đã chốt, ngoài chỗ đường nhánh rẽ ra.</li>\n<li><b>[I]</b> Tsuruga: theo yêu cầu, mockup cắt cả bốn đường tại cùng một vị trí và đặt 4 chắn cuối; đã bỏ ghi đơn s sau ga (82 m) và đường dẫn về depot (danh sách đoạn bỏ nằm ở khoá <code>dropped</code> của <code>hok_graph.json</code>).</li>\n<h3>Đánh giá tác động (chưa đưa vào game)</h3>\n<p>Cả 18 ga đều khớp mã bố cục hiện có của game (không ga nào phải đổi mã). Việc cần làm chỉ là khai báo <code>xo</code> theo hình; 4 ga giữ nguyên (Karuizawa, Nagano, Kanazawa, Tsuruga), 14 ga sửa xo.</p>\n<table><tr><th>Ga</th><th>Mã game</th><th>Hình</th><th>Việc cần làm</th></tr>\n<tr><td>Annaka-Haruna</td><td><code>2-2-0</code></td><td>PduP; không ghi chéo</td><td>Giữ mã; <b>xo = []</b></td></tr>\n<tr><td>Karuizawa</td><td><code>2-4-0</code></td><td>dPduPu; X kép hai đầu</td><td><b>Giữ nguyên</b></td></tr>\n<tr><td>Sakudaira</td><td><code>2-2-0</code></td><td>PduP; không ghi chéo</td><td>Giữ mã; <b>xo = []</b></td></tr>\n<tr><td>Ueda</td><t E('text',{x:-8,y:C.titleY,'font-size':15,'font-weight':'bold',fill:'#111'},null,'1. Nguyên bản ghép: '+C.figNames+' — các hình nối nhau tại '+G.seams.length+' chỗ (đường đỏ nét đứt), không sửa nội dung');
const defs=E('defs',{});
C.figs.forEach((f,i)=>{const cp=E('clipPath',{id:'c'+i},defs);E('rect',{x:f.cl,y:C.band[0],width:f.cr-f.cl,height:C.band[1]-C.band[0]},cp);
  const g=E('g',{'clip-path':'url(#c'+i+')'});E('image',{href:DATA.figs[i].src,x:f.x,y:f.y,width:DATA.figs[i].w,height:DATA.figs[i].h},g);
  E('text',{x:f.cl+4,y:C.band[0]+10,'font-size':9,fill:'#8a8f96'},null,f.name)});
G.seams.forEach(sm=>{E('line',{x1:sm.x,y1:C.band[0],x2:sm.x,y2:C.band[1],stroke:'#e11d48','stroke-width':.8,'stroke-dasharray':'4 3'})});
const ov=E('g',{id:'ov',style:'display:none',opacity:.85});
for(const e of G.edges)E('line',{x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,stroke:'#ff2d55','stroke-width':1.2},ov);
for(const n of G.nodes)E('circle',{cx:n.x,cy:n.y,r:n.kind==='switch'?2.8:n.kind==='diamond'?3.2:n.kind==='end'?2.4:1.6,fill:n.kind==='switch'?'#ff2d55':n.kind==='diamond'?'#f59e0b':n.kind==='end'?'#111':'#aaa'},ov);
for(const p of G.platforms)E('rect',{x:p.x1,y:p.y1,width:p.x2-p.x1,height:p.y2-p.y1,fill:'none',stroke:'#16a34a','stroke-width':1.2},ov);
document.getElementById('cOv').onchange=e=>ov.style.display=e.target.checked?'':'none';
// ===== 2. Mockup =====
const m=E('g',{transform:`translate(0,${MY})`});
E('rect',{x:VB.x,y:C.mockTop-MY,width:VB.w,height:VB.y+VB.h-C.mockTop,fill:'#18222e'},m);
E('text',{x:-8,y:C.mockTop-MY+14,'font-size':15,'font-weight':'bold',fill:'#e8eaed'},m,'2. Mockup giản lược (cùng toạ độ, ngay dưới nguyên bản): '+C.dropNote);
const COL={d:'#4aa3ff',u:'#2ed3b7',cross:'#f5b74a'};
const used=new Set(),usedPts=[];const inBox=e=>(C.keepBoxes||[]).some(b=>Math.min(e.x1,e.x2)>=b[0]&&Math.max(e.x1,e.x2)<=b[2]&&Math.min(e.y1,e.y2)>=b[1]&&Math.max(e.y1,e.y2)<=b[3]);const dropEdge=e=>e.group==='depot'&&!inBox(e);
for(const s of G.stations){{const tp=Math.min(...s.tracks.map(t=>t.y),G.main.down_y),bt=Math.max(...s.tracks.map(t=>t.y),G.main.up_y);E('rect',{x:s.x1-14,y:tp-22,width:s.x2-s.x1+28,height:bt-tp+44,rx:6,fill:'#243445',opacity:.7},m)}}
function ecol(e){if(e.role==='main_d')return COL.d;if(e.role==='main_u')return COL.u;if(e.role==='crossover')return COL.cross;return ((e.y1+e.y2)/2<(G.main.down_y+G.main.up_y)/2)?'#8fc4ff':'#7fe6d3'}
for(const e of G.edges){if(dropEdge(e))continue;used.add(e.a);used.add(e.b);usedPts.push([e.x1,e.y1],[e.x2,e.y2]);const l=E('line',{x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,stroke:ecol(e),'stroke-width':e.role.startsWith('main')?4.2:3,'stroke-linecap':'round'},m);E('title',{},l,`${e.id} ${e.role}${e.group?' / '+e.group:''}`)}
for(const p of G.platforms){E('rect',{x:p.x1,y:p.y1,width:p.x2-p.x1,height:p.y2-p.y1,rx:2,fill:'#e8e2cf',stroke:'#9a937c'},m)}
for(const b of G.bumpers){if(!usedPts.some(q=>Math.abs(q[0]-b.x)<.8&&Math.abs(q[1]-b.y)<.8))continue;const x=b.x+(b.end==='L'?-2:2);E('line',{x1:x,y1:b.y-4.5,x2:x,y2:b.y+4.5,stroke:'#ff6b6b','stroke-width':2.4},m)}
const idg=E('g',{id:'ids',style:'display:none'},m);let swn=0;
for(const n of G.nodes.slice().sort((a,b)=>a.x-b.x||a.y-b.y)){
  if(!used.has(n.id))continue;
  if(n.kind==='switch'){swn++;E('circle',{cx:n.x,cy:n.y,r:3.3,fill:'#fff',stroke:'#111','stroke-width':1},m);E('text',{x:n.x+3,y:n.y-5,'font-size':7,fill:'#ffd479'},idg,'S'+swn)}
  if(n.kind==='diamond'){E('rect',{x:n.x-3,y:n.y-3,width:6,height:6,fill:'#f5b74a',stroke:'#111','stroke-width':.8,transform:`rotate(45 ${n.x} ${n.y})`},m)}
}
document.getElementById('cId').onchange=e=>idg.style.display=e.target.checked?'':'none';
const KM=DATA.km, LY=G.main.down_y-23;
G.stations.forEach((s,i)=>{
  const top=Math.min(...s.tracks.map(t=>t.y),G.main.down_y), ly=Math.min(LY,top-24), lab=E('g',{},m), bot=Math.max(LY+(s.tracks.length>2?94:68),Math.max(...s.tracks.map(t=>t.y),G.main.up_y)+38);
  E('text',{x:s.cx,y:ly-26,'text-anchor':'middle','font-size':14,'font-weight':'bold',fill:'#fff'},lab,s.jp);
  E('text',{x:s.cx,y:ly-14,'text-anchor':'middle','font-size':10,fill:'#cfd6de'},lab,s.en||KM[i].en);
  const ov=(C.tokenShow||{})[KM[i].en];E('text',{x:s.cx,y:bot,'text-anchor':'middle','font-size':9.5,fill:'#9fb3c8'},lab,`km ${KM[i].km.toFixed(1)} · ${ov?ov[0]:s.token}`);
  E('text',{x:s.cx,y:bot+11,'text-anchor':'middle','font-size':9,fill:'#7f93a8'},lab,ov?ov[1]:`${s.tracks.length} đường, ${s.plats.length} sân`);
});
// khoanh ga cần sửa / giữ nguyên (cfg.verdict: {tên ga: [loại, ghi chú]}; loại: keep | xo | code | look)
if(C.verdict){const VC={keep:['#3ddc84','GIỮ NGUYÊN'],xo:['#ffb020','SỬA XO'],code:['#ff5d6c','ĐỔI MÃ + XO'],look:['#5aa9ff','XEM THÊM']};
  G.stations.forEach((s,i)=>{const v=C.verdict[KM[i].en];if(!v)return;const col=VC[v[0]][0],top0=Math.min(...s.tracks.map(t=>t.y),G.main.down_y),ly=Math.min(LY,top0-24),bot=Math.max(LY+(s.tracks.length>2?94:68),Math.max(...s.tracks.map(t=>t.y),G.main.up_y)+38),x=s.x1-12,w=s.x2-s.x1+24,y=ly-58,h=bot+26-y;
    E('rect',{x:x,y:y,width:w,height:h,rx:8,fill:col,'fill-opacity':.08,stroke:col,'stroke-width':3},m);
    E('text',{x:s.cx,y:y-6,'text-anchor':'middle','font-size':10.5,'font-weight':'bold',fill:col},m,VC[v[0]][1]);
    E('text',{x:s.cx,y:y+h+11,'text-anchor':'middle','font-size':8.5,fill:col},m,v[1])});}
for(let i=0;i<G.stations.length-1;i++){const a=G.stations[i],b=G.stations[i+1];const x1=a.x2+16,x2=b.x1-16,y=LY-4;
  if(x2-x1<30)continue;E('line',{x1:x1,y1:y,x2:x2,y2:y,stroke:'#566a80','stroke-width':.8,'stroke-dasharray':'3 3'},m);
  E('text',{x:(x1+x2)/2,y:y-3,'text-anchor':'middle','font-size':9,fill:'#8aa0b6'},m,(KM[i+1].km-KM[i].km).toFixed(1)+' km (rút gọn)')}
G.seams.forEach(sm=>{E('line',{x1:sm.x,y1:C.mockSeam?C.mockSeam[0]:-46,x2:sm.x,y2:C.mockSeam?C.mockSeam[1]:152,stroke:'#e11d48','stroke-width':.8,'stroke-dasharray':'4 3',opacity:.5},m)});
for(const t of C.mockNotes||[])E('text',{x:t.x,y:t.y,'font-size':10,fill:'#c9b8ff'},m,t.s);
// chú giải
const lg=E('g',{transform:'translate(-8,'+(C.legendY||175)+')'},m);let lx=0;
for(const [c,t] of [[COL.d,'đường chính xuống'],[COL.u,'đường chính lên'],[COL.cross,'đường chéo giữa hai đường chính']]){E('line',{x1:lx,y1:0,x2:lx+22,y2:0,stroke:c,'stroke-width':4},lg);E('text',{x:lx+27,y:3.5,'font-size':10,fill:'#cfd6de'},lg,t);lx+=27+t.length*6.2+16}
E('circle',{cx:lx+4,cy:0,r:3.3,fill:'#fff',stroke:'#111'},lg);E('text',{x:lx+12,y:3.5,'font-size':10,fill:'#cfd6de'},lg,'ghi');lx+=44;
E('rect',{x:lx,y:-3,width:6,height:6,fill:'#f5b74a',transform:`rotate(45 ${lx+3} 0)`},lg);E('text',{x:lx+12,y:3.5,'font-size':10,fill:'#cfd6de'},lg,'giao cắt (diamond)');lx+=135;
E('line',{x1:lx,y1:-4.5,x2:lx,y2:4.5,stroke:'#ff6b6b','stroke-width':2.4},lg);E('text',{x:lx+6,y:3.5,'font-size':10,fill:'#cfd6de'},lg,'chắn cuối đường');
if(C.verdict){let vx=0;for(const [c,t] of [['#3ddc84','giữ nguyên (mã và ghi chéo khớp hình)'],['#ffb020','giữ mã, sửa ghi chéo (xo)'],['#ff5d6c','đổi mã bố trí (và ghi chéo)'],['#5aa9ff','cần xem thêm']]){E('rect',{x:vx,y:16,width:14,height:10,rx:2,fill:'none',stroke:c,'stroke-width':2.5},lg);E('text',{x:vx+20,y:25,'font-size':10,fill:'#cfd6de'},lg,t);vx+=26+t.length*5.6+14}}
// ===== bảng ghi chú =====
const info=document.getElementById('info');
let h='<h3>Bảng ga (trích từ đồ thị)</h3><table><tr><th>Ga</th><th>km</th><th>Mã</th><th>Game</th></tr>';
G.stations.forEach((s,i)=>h+=`<tr><td>${s.jp}</td><td>${KM[i].km.toFixed(1)}</td><td><code>${s.token}</code></td><td>${KM[i].lay}</td></tr>`);
h+=`</table><h3>Số liệu</h3><ul><li>Nút ${G.nodes.length}, cạnh ${G.edges.length}, ghi ${G.switches.length}, giao cắt ${G.nodes.filter(n=>n.kind==='diamond').length}, tín hiệu ${G.signals.length}, chắn cuối ${G.bumpers.length} (đồ thị đủ; mockup bỏ phần giản lược).</li><li>Đường chính: xuống y=${G.main.down_y}, lên y=${G.main.up_y} (hệ ghép).</li></ul>`;
h+=DATA.notes;info.innerHTML=h;
document.getElementById('bInfo').onclick=()=>info.style.display=info.style.display==='block'?'none':'block';
// ===== pan / zoom =====
let s=1,tx=0,ty=0;const MIN=0.12,MAX=14;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;zl.textContent=Math.round(s*100)+'%'}
function zoomAt(f,cx,cy){const n=Math.min(MAX,Math.max(MIN,s*f));f=n/s;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;s=n;apply()}
const vc=()=>{const r=view.getBoundingClientRect();return[r.width/2,r.height/2]};
function fit(){const r=view.getBoundingClientRect();s=Math.min(r.width/VB.w,r.height/VB.h);tx=(r.width-VB.w*s)/2;ty=(r.height-VB.h*s)/2;apply()}
function jump(i){const st=G.stations[i],r=view.getBoundingClientRect();s=Math.min(1.6,r.width/((st.x2-st.x1)+260));const cx=(st.x1+st.x2)/2,cy=(C.band[0]+C.band[1])/2+ (MY+60-(C.band[0]+C.band[1])/2)/2;tx=r.width/2-cx*s;ty=r.height/2-(cy-VB.y)*s;apply()}
G.stations.forEach((st,i)=>{const b=document.createElement('button');b.textContent=st.en||KM[i].en;b.onclick=()=>jump(i);document.getElementById('jumps').appendChild(b)});
const ptr=new Map();let lastD=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);view.classList.add('drag');lastD=0});
view.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
  if(ptr.size===1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);apply()}
  else if(ptr.size===2){ptr.set(e.pointerId,[e.clientX,e.clientY]);const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastD){const r=view.getBoundingClientRect();zoomAt(d/lastD,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top)}lastD=d}});
const up=e=>{ptr.delete(e.pointerId);if(!ptr.size)view.classList.remove('drag');lastD=0};
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();const r=view.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
view.addEventListener('dblclick',e=>{const r=view.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top)});
document.getElementById('zi').onclick=()=>{const[c,d]=vc();zoomAt(1.4,c,d)};
document.getElementById('zo').onclick=()=>{const[c,d]=vc();zoomAt(1/1.4,c,d)};
document.getElementById('fit').onclick=fit;
addEventListener('resize',fit);fit();
</script></body></html>
